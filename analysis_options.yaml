include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated worker copies are validated before they are moved here.
    - worker/generated/**
    # Native copies are generated from the same already-validated sources.
    - lib/generated/**
    # Flutter 3.47 upgrades older projects to exclude generated build/platform trees.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
