name: sorting_sandbox
description: A classroom sorting-algorithm visualizer, race arena and analyzer.
publish_to: none
version: 2.0.0-dev.1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.2.0
  web: ^1.1.1
  sorting_sandbox_api:
    path: packages/sorting_sandbox_api

dev_dependencies:
  analyzer: ^14.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
